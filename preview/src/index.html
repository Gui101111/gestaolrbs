<meta charset="utf-8">
<title>TRIBUNA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demonstração do TRIBUNA, a edição de vídeo com IA para advogados, rodando no navegador.">
<meta name="theme-color" content="#101216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script>try{if(localStorage.getItem("tribuna-theme")==="claro")document.documentElement.dataset.theme="claro"}catch(e){}</script>
<style>
  /* Fundo e tipografia valem antes do JavaScript carregar; depois seguem o tema (Grafite ou Claro). */
  :root {
    --font-sora: "Sora";
    --font-manrope: "Manrope";
    --font-instrument: "Instrument Serif";
    color-scheme: dark;
    background: var(--canvas, #1a1d22);
  }
  :root[data-theme="claro"] {
    color-scheme: light;
  }
  body {
    margin: 0;
    background: var(--page-bg, #1a1d22);
    background-attachment: fixed;
    color: var(--fg, #f4f5f7);
    font-family: "Manrope", ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #tribuna-boot {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: var(--page-bg, #1a1d22);
    color: var(--gold, #f2c46d);
    font: 700 1.5rem/1 "Sora", ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.4em;
  }
</style>
<div id="tribuna-root"><div id="tribuna-boot">TRIBUNA</div></div>
<noscript><p style="padding:24px;color:#a7adb7">Ative o JavaScript para ver a prévia.</p></noscript>
<script src="app.js" charset="utf-8"></script>
